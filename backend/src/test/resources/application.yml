spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  h2:
    console:
      enabled: false
  flyway:
    enabled: false

jwt:
  secret: test-secret-key-that-is-minimum-256-bits-long-for-hmac-sha256
  expiration: 86400000

file:
  upload-dir: /tmp/test-uploads
  base-url: http://localhost:8080/files

naver:
  ocr:
    url: http://test-ocr-url
    secret-key: test-secret-key

management:
  metrics:
    export:
      prometheus:
        enabled: false

killnagi:
  session:
    lifecycle:
      poll-rate-ms: 3600000  # 테스트 중 자동 정리 배치가 실행되지 않도록 크게 설정
