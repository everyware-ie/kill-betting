spring:
  application:
    name: killnagi-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:killnagi}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:test_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    time-zone: Asia/Seoul
    deserialization:
      read-enums-using-to-string: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24시간 (ms)

admin:
  email: ${ADMIN_EMAIL:}  # 어드민 지표 대시보드 접근 허용 단일 이메일

killnagi:
  session:
    lifecycle:
      poll-rate-ms: ${SESSION_LIFECYCLE_POLL_RATE_MS:60000}  # 세션 자동 정리 배치 폴링 주기 (ADR 0002)
      inactivity-timeout-hours: ${SESSION_INACTIVITY_TIMEOUT_HOURS:6}  # 진행중 무응답 자동종료 임계 (InactivityTimeout)
      stale-waiting-timeout-hours: ${SESSION_STALE_WAITING_TIMEOUT_HOURS:3}  # 대기중 미시작 자동삭제 임계 (StaleWaitingRoom)

storage:
  type: ${STORAGE_TYPE:local}

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}
  base-url: ${FILE_BASE_URL:http://localhost:8080/files}

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:}
    region: ${AWS_S3_REGION:}

naver:
  ocr:
    url: ${NAVER_OCR_URL:}
    secret-key: ${NAVER_OCR_SECRET_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, loggers
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: killnagi-backend

logging:
  level:
    com.killnagi: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: trace

