services:
  redis:
    image: redis:7-alpine
    container_name: killnagi-redis
    ports:
      - "6379:6379"
    networks:
      - killnagi-net
    restart: on-failure:3

  backend:
    build:
      context: ./backend
    image: ghcr.io/everyware-ie/kill-betting-backend:${BACKEND_IMAGE_TAG:-latest}
    container_name: killnagi-backend
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    ports:
      - "8080:8080"
    networks:
      - default
      - killnagi-net
    volumes:
      - upload-data:/app/uploads
    depends_on:
      - redis
    restart: on-failure:3

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    image: ghcr.io/everyware-ie/kill-betting-frontend:${FRONTEND_IMAGE_TAG:-latest}
    container_name: killnagi-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: killnagi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - killnagi-net
    restart: on-failure:3

  loki:
    image: grafana/loki:latest
    container_name: killnagi-loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    networks:
      - killnagi-net
    restart: on-failure:3

  grafana:
    image: grafana/grafana:latest
    container_name: killnagi-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=https://killnagi.duckdns.org/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - killnagi-net
    depends_on:
      - prometheus
      - loki
    restart: on-failure:3

volumes:
  upload-data:
  grafana-data:
  prometheus-data:
  loki-data:

networks:
  killnagi-net:
    external: true
    name: killnagi-net