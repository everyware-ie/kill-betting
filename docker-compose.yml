services:
  mysql:
    image: mysql:8.0
    container_name: killnagi-mysql
    environment:
      MYSQL_DATABASE: killnagi
      MYSQL_ROOT_PASSWORD: killnagi_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pkillnagi_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: killnagi-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: killnagi
      DB_USERNAME: root
      DB_PASSWORD: killnagi_password
      JWT_SECRET: secretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecret
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: killnagi-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql-data:
